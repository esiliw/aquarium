name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: data diagnostics
        if: success()
        continue-on-error: true
        run: |
          AQUARIUM_DIAG=1 ./gradlew test --rerun-tasks 2>&1 | tee diag.log || true
          grep "DIAG " diag.log | sed 's/^.*DIAG /DIAG /' | while IFS= read -r line; do echo "::notice::${line//%/%25}"; done
          grep -E "FAILED|Exception|error:" diag.log | head -20 | while IFS= read -r line; do echo "::warning::${line//%/%25}"; done
      - name: report errors
        if: failure()
        run: |
          # turn compiler / gradle errors into annotations so they can be read through the API
          grep -E "error:|warning: \[|What went wrong|Could not|Caused by|> " build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          tail -40 build.log | while IFS= read -r line; do echo "::error title=tail::${line//%/%25}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: aquarium-jar
          path: build/libs/*.jar
      - name: publish "latest" download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$JAR" --prerelease --title "Latest build" \
            --notes "Built automatically from $(git rev-parse --short HEAD). Put the .jar in your mods folder (Fabric 1.20.1 + Fabric API)."
