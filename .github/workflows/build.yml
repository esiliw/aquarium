name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: aquarium-jar
          path: build/libs/*.jar
