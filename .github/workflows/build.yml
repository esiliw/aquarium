name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - uses: actions/setup-java@v5
        id: jdk17
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: server smoke test
        # start a real Fabric 1.20.1 server with an Earth world: catches worldgen files that fail to load, crashes on
        # world creation and dedicated-server problems before anything is released
        env:
          JAVA17: ${{ steps.jdk17.outputs.path }}
        run: |
          L=$(grep '^loader_version' gradle.properties | cut -d= -f2)
          F=$(grep '^fabric_api_version' gradle.properties | cut -d= -f2)
          I=$(curl -sSf https://meta.fabricmc.net/v2/versions/installer | jq -r '.[0].version')
          mkdir -p smoke/mods && cd smoke
          curl -sSfL -o server.jar "https://meta.fabricmc.net/v2/versions/loader/1.20.1/$L/$I/server/jar"
          curl -sSfL -o mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$F/fabric-api-$F.jar"
          cp "$(ls ../build/libs/*.jar | grep -v sources | head -1)" mods/
          echo eula=true > eula.txt
          printf 'level-type=aquarium:earth\nonline-mode=false\n' > server.properties
          "$JAVA17/bin/java" -Xmx3G -jar server.jar nogui > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 180); do
            grep -q 'Done (' server.log && break
            kill -0 $PID 2>/dev/null || break
            sleep 5
          done
          kill $PID 2>/dev/null || true
          grep -E 'Done \(|ERROR|Exception|Caused by|Failed|crash' server.log | head -60 | while IFS= read -r line; do echo "::warning title=server::${line//%/%25}"; done
          grep -q 'Done (' server.log
      - name: data diagnostics
        if: success()
        continue-on-error: true
        run: |
          AQUARIUM_DIAG=1 ./gradlew test --rerun-tasks 2>&1 | tee diag.log || true
          grep "DIAG " diag.log | sed 's/^.*DIAG /DIAG /' | while IFS= read -r line; do echo "::notice::${line//%/%25}"; done
          grep -E "FAILED|Exception|error:|WARN" diag.log | head -40 >> diag-summary.txt || true
          grep "DIAG " diag.log | sed 's/^.*DIAG /DIAG /' >> diag-summary.txt || true
          # publish the full diagnostics on the 'diag' branch so they can be read without the log viewer
          git config user.name "aquarium-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan diag-out
          git rm -rfq --cached . >/dev/null
          mkdir -p diag-png && cp build/diag/*.png diag-png/ 2>/dev/null || true
          git add -f diag-summary.txt diag-png
          git commit -qm "diagnostics for ${GITHUB_SHA::7}"
          git push -qf origin diag-out:diag
      - name: report errors
        if: failure()
        run: |
          # turn compiler / gradle errors into annotations so they can be read through the API
          grep -E "error:|warning: \[|What went wrong|Could not|Caused by|> " build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          tail -40 build.log | while IFS= read -r line; do echo "::error title=tail::${line//%/%25}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: aquarium-jar
          path: build/libs/*.jar
      - name: publish "latest" download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$JAR" --prerelease --title "Latest build" \
            --notes "Built automatically from $(git rev-parse --short HEAD). Put the .jar in your mods folder (Fabric 1.20.1 + Fabric API)."
