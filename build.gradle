plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base { archivesName = 'aquarium' }

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// XZ decompression for the Terrarium raster tiles, shipped inside the mod jar
	include(implementation("org.tukaani:xz:1.9"))
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.20.1 runs on Java 17
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") { rename { "${it}_aquarium" } }
}
